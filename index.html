<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8fb" />
    <meta
      name="description"
      content="A resilient, backend-free DWD weather display for kiosk browsers."
    />
    <title>Weather display</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="wrap header">
      <div>
        <h1 id="title">Weather</h1>
        <div class="meta">
          <span id="provider-name">DWD ICON via Open-Meteo</span
          ><span aria-hidden="true">•</span> <span id="timezone"></span
          ><span aria-hidden="true">•</span>
          <span id="version"></span>
        </div>
      </div>
      <div class="datetime">
        <time id="date">--</time
        ><time class="clock" id="clock" aria-live="off">--:--:--</time>
      </div>
    </header>

    <main class="wrap grid">
      <section class="tile now" aria-labelledby="now-heading">
        <h2 id="now-heading">Current</h2>
        <div class="current-summary">
          <span class="big" id="now-temp">--°C</span>
          <span class="weather-icon" id="now-icon" aria-hidden="true">⛅</span>
          <span id="now-description">Loading…</span>
        </div>
        <dl class="kv">
          <dt>Feels like</dt>
          <dd id="now-feels">--°C</dd>
          <dt>Today's low / high</dt>
          <dd id="now-range">-- / --°C</dd>
          <dt>Precipitation</dt>
          <dd id="now-precip">-- mm</dd>
          <dt>Humidity</dt>
          <dd id="now-humidity">-- %</dd>
          <dt>Air pressure</dt>
          <dd id="now-pressure">-- hPa</dd>
          <dt>Wind</dt>
          <dd id="now-wind">-- km/h</dd>
          <dt>Wind gusts</dt>
          <dd id="now-gust">-- km/h</dd>
          <dt>UV index</dt>
          <dd id="now-uv">--</dd>
          <dt>Sunrise / sunset</dt>
          <dd id="now-sun">--:-- / --:--</dd>
        </dl>
      </section>

      <section class="tile forecast" aria-labelledby="forecast-heading">
        <div class="forecast-header">
          <h2 id="forecast-heading">Forecast</h2>
          <div>
            <span class="view-label" id="view-label"></span>
            <button
              id="flip-button"
              type="button"
              aria-label="Switch forecast view"
            >
              ↻
            </button>
          </div>
        </div>
        <div class="slots" id="forecast-slots" aria-live="polite"></div>
      </section>
    </main>

    <footer class="wrap footer">
      <div class="progress" aria-label="Year progress">
        <i id="year-progress"></i>
      </div>
      <div class="year-label" id="year-label">--% of year</div>
      <div class="status" id="status" role="status">Starting…</div>
    </footer>

    <template id="slot-template">
      <article class="slot">
        <h3></h3>
        <div class="slot-temp"></div>
        <div class="slot-details"></div>
      </article>
    </template>

    <noscript>This display requires JavaScript.</noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
