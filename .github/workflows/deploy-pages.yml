name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build static artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css app.js weather.js providers.js settings.js version.js config.js sw.js manifest.webmanifest LICENSE _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
